{% extends 'base.html' %}{% block title %}Reset password{% endblock %}{% block content %}<section class="container py-16"><div class="panel max-w-md mx-auto p-8"><h1 class="text-3xl font-extrabold text-ink">Reset your password</h1><p class="text-sm my-4">Enter your account email. In development, the reset email appears in the server console.</p><form method="post">{% csrf_token %}<div class="form-group"><label>Email</label><input class="form-input" type="email" name="email" required></div><button class="btn btn-primary w-full">Send reset link</button></form></div></section>{% endblock %}
