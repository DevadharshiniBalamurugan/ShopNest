{% extends 'base.html' %}{% block title %}Manage product{% endblock %}{% block content %}<section class="container py-12"><div class="panel max-w-3xl mx-auto p-8"><span class="kicker">Seller catalog</span><h1 class="text-3xl font-extrabold text-ink mb-6">{% if product %}Edit {{ product.name }}{% else %}Add a new product{% endif %}</h1><form method="post" enctype="multipart/form-data">{% csrf_token %}<div class="grid sm:grid-cols-2 gap-x-4">{% for field in form %}<div class="form-group {% if field.name == 'description' or field.name == 'specifications' %}sm:col-span-2{% endif %}"><label>{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}</div><button class="btn btn-primary">Save product</button></form></div></section>{% endblock %}
