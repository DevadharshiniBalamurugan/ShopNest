{% extends 'base.html' %}{% block title %}Contact{% endblock %}{% block content %}<section class="container py-16"><div class="grid lg:grid-cols-2 gap-10"><div><span class="kicker">We’re here to help</span><h1 class="text-5xl font-extrabold text-ink">Let’s talk.</h1><p class="text-lg mt-5">Questions about an order, a product, or ShopNest? Send us a note.</p><p class="mt-8"><b>hello@shopnest.demo</b><br>Mon–Sat, 9am–6pm IST</p></div><form class="panel p-7" onsubmit="event.preventDefault(); showToast('Message received — we’ll be in touch!'); this.reset()"><div class="form-group"><label>Name</label><input class="form-input" required></div><div class="form-group"><label>Email</label><input class="form-input" type="email" required></div><div class="form-group"><label>Message</label><textarea class="form-input" rows="5" required></textarea></div><button class="btn btn-primary">Send message</button></form></div></section>{% endblock %}
