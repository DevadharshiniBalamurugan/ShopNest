{% extends 'base.html' %}{% block title %}Edit profile{% endblock %}{% block content %}<section class="container py-12"><div class="panel max-w-2xl mx-auto p-8"><span class="kicker">Account settings</span><h1 class="text-3xl font-extrabold text-ink mb-6">Edit your profile</h1><form method="post" enctype="multipart/form-data">{% csrf_token %}<div class="grid sm:grid-cols-2 gap-x-4">{% for field in uform %}<div class="form-group"><label>{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}{% for field in pform %}<div class="form-group {% if field.name == 'bio' %}sm:col-span-2{% endif %}"><label>{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}</div><button class="btn btn-primary">Save changes</button></form></div></section>{% endblock %}
