{% extends 'base.html' %}{% block title %}Address{% endblock %}{% block content %}<section class="container py-12"><div class="panel max-w-xl mx-auto p-8"><span class="kicker">Where should we deliver?</span><h1 class="text-3xl font-extrabold text-ink mb-6">{% if address %}Edit{% else %}Add{% endif %} address</h1><form method="post">{% csrf_token %}<div class="grid sm:grid-cols-2 gap-x-4">{% for field in form %}<div class="form-group {% if field.name == 'address' %}sm:col-span-2{% endif %}"><label>{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}</div><button class="btn btn-primary">Save address</button></form></div></section>{% endblock %}
